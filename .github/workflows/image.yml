name: image

# Builds and pushes the Voitta RAG Enterprise container image.
#
# Triggers:
# - push to main      → tag :main + :sha-<short>     (rolling dev image)
# - push of a v*.*.*  → tag :<semver> + :latest      (release image)
# - manual dispatch   → tag of the user's choice
#
# Customers consume this image; they never build it themselves. The
# Terraform module references the image by tag.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: short SHA)"
        required: false
        type: string
  workflow_call:
    # Invoked by release.yml's tag-and-release job. A tag created with
    # GITHUB_TOKEN does not trigger the `tags: ["v*.*.*"]` push event
    # above, so the release job calls this workflow directly instead.
    inputs:
      release_tag:
        description: "Semver tag being released (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The model-warm stage downloads ~5-7GB; give it room. Free runners
    # are slow but adequate, and the layer is cached after the first run.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        # Default runner has ~14GB free. The warmed image hits ~35GB peak
        # disk during the multi-stage copy. jlumbroso/free-disk-space
        # reliably reclaims ~45GB by removing dotnet, android, ghc,
        # haskell, haskellghc, swap, and large preinstalled images.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release tag
        # workflow_call gives us the version explicitly (a GITHUB_TOKEN-
        # created tag doesn't fire the push:tags event below). A direct
        # tag push or workflow_dispatch on a tag ref has no such input,
        # so fall back to github.ref in that case. Anything else (a plain
        # branch push or a workflow_dispatch not on a tag) isn't a
        # release build - leave it empty and the semver/latest tags stay
        # disabled below.
        id: ver
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            release_tag="$RELEASE_TAG_INPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            release_tag="${REF#refs/tags/}"
          else
            release_tag=""
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.release_tag }},enable=${{ steps.ver.outputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.release_tag }},enable=${{ steps.ver.outputs.release_tag != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.ver.outputs.release_tag != '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
